ID: mmt.devops.ui.cpi.delivery
_schema-version: '3.2'
version: 1.0.0

modules:
  - name: mmt.devops.ui.cpi.delivery
    type: nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - npm --prefix .. run build-only
    parameters:
      memory: 256M
      disk-quota: 512M
      hosts:
        - mmt-devops-ui-cpi-delivery-dev
    properties:
      destinations:
        - name: backendservice
          url: https://com-sap-maco-mmt-srv-devops-cpi-delivery.cfapps.sap.hana.ondemand.com/api/v1
          forwardAuthToken: true
        - name: cpi-cookie-service
          url: https://localhost:8080 # to be deployed
          forwardAuthToken: true
    requires:
      - name: mmt_devops_uaa

resources:
  - name: mmt_devops_uaa
    type: org.cloudfoundry.existing-service
